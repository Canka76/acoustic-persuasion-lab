[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sap-stimulus"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "sap-core",
  "pyworld",
  "piper-tts",
  "torchaudio",
  "torch",
  "joblib",
]

[project.optional-dependencies]
f5 = ["f5-tts"]

[tool.hatch.build.targets.wheel]
packages = ["sap_stimulus"]

[tool.uv.sources]
sap-core = { workspace = true }
