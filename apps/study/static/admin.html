<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Study Admin</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;line-height:1.6}
  h1{margin-bottom:16px}
  input[type=text]{padding:8px;width:320px;border:1px solid #ccc;border-radius:4px;font-size:1rem}
  button{padding:8px 18px;background:#1a73e8;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:1rem;margin-left:8px}
  button:disabled{background:#aaa}
  .error{color:#c0392b;margin-top:8px}
  pre{background:#f5f5f5;padding:16px;border-radius:4px;overflow:auto;max-height:500px;font-size:.85rem}
  table{border-collapse:collapse;width:100%;font-size:.85rem;margin-top:16px}
  th,td{border:1px solid #ddd;padding:6px 10px;text-align:left}
  th{background:#f0f0f0}
  .row-controls{display:flex;align-items:center;gap:8px;margin-top:20px}
</style>
</head>
<body>
<h1>Study Admin Panel</h1>

<div class="row-controls">
  <input type="text" id="token-input" placeholder="Admin token" value="dev-token">
  <button id="btn-csv">⬇ Download export.csv</button>
  <button id="btn-participants">View recent participants</button>
</div>

<div class="error" id="error-msg"></div>
<div id="output"></div>

<script type="module">
  const tokenEl = document.getElementById('token-input');
  const errEl   = document.getElementById('error-msg');
  const outEl   = document.getElementById('output');

  function token() { return tokenEl.value.trim(); }

  document.getElementById('btn-csv').addEventListener('click', () => {
    // Build a link with the token in the header — but fetch API needed for custom headers.
    // Use fetch, then create blob URL.
    errEl.textContent = '';
    fetch('/admin/export.csv', { headers: { 'X-Admin-Token': token() } })
      .then(async r => {
        if (!r.ok) { errEl.textContent = `Error ${r.status}: ${await r.text()}`; return; }
        const blob = await r.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'export.csv'; a.click();
        URL.revokeObjectURL(url);
      })
      .catch(e => { errEl.textContent = e.message; });
  });

  document.getElementById('btn-participants').addEventListener('click', () => {
    errEl.textContent = '';
    outEl.innerHTML = 'Loading…';
    fetch('/admin/participants', { headers: { 'X-Admin-Token': token() } })
      .then(async r => {
        if (!r.ok) { errEl.textContent = `Error ${r.status}: ${await r.text()}`; outEl.innerHTML=''; return; }
        const data = await r.json();
        if (!data.length) { outEl.innerHTML = '<p>No participants yet.</p>'; return; }
        // Render as table
        const cols = Object.keys(data[0]);
        let html = '<table><thead><tr>' + cols.map(c=>`<th>${c}</th>`).join('') + '</tr></thead><tbody>';
        for (const row of data) {
          html += '<tr>' + cols.map(c=>`<td>${row[c] ?? ''}</td>`).join('') + '</tr>';
        }
        html += '</tbody></table>';
        outEl.innerHTML = html;
      })
      .catch(e => { errEl.textContent = e.message; outEl.innerHTML=''; });
  });
</script>
</body>
</html>
